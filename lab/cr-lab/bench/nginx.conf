# Reference server for the multigig browser bench: a known-fast sendfile/discard server, so the numbers show what the
# *browser* can do, independent of exp-speedtest. Run: bench/ref-server.sh (docker) or nginx -c $PWD/bench/nginx.conf -p $PWD/bench/
worker_processes auto;
pid /tmp/mgig-bench-nginx.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_requests 100000;
  keepalive_timeout 60s;
  client_max_body_size 0;
  client_body_buffer_size 1m;
  types { text/html html; text/javascript js; application/octet-stream bin; }
  server {
    listen 8081 reuseport;
    root BENCH_ROOT;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    location = / { try_files /page/index.html =404; }
    location /page/ { }
    # /down/25m, /down/100m: sparse files created by ref-server.sh
    location /down/ { alias BENCH_DATA/; }
    # nginx reads and discards the body before answering
    location = /up { return 204; }
  }
}
