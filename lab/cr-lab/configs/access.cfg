! cr-lab access switch (AOS-CX, vrnetlab aruba_arubaos-cx). Ports: eth1 = 1/1/1, eth2 = 1/1/2, ...
! UNVERIFIED against this image: written from AOS-CX 10.x CLI conventions, not tested on the 20250822141147 build.
! Management (interface mgmt, admin user, SSH) is left to vrnetlab's own bootstrap.
! If a line is rejected, fix it on the console (see README, "AOS-CX") and copy the result back here.
hostname access
!
vlan 1
vlan 10
    name hall-a
vlan 20
    name hall-b
vlan 30
    name hall-c
!
interface 1/1/1
    no shutdown
    description uplink to core eth1
    ip address 172.30.255.1/31
interface 1/1/2
    no shutdown
    no routing
    description probe-a
    vlan access 10
interface 1/1/3
    no shutdown
    no routing
    description probe-b
    vlan access 20
interface 1/1/4
    no shutdown
    no routing
    description probe-c
    vlan access 30
interface 1/1/5
    no shutdown
    no routing
    description client1
    vlan access 10
interface 1/1/6
    no shutdown
    no routing
    description client2
    vlan access 10
interface 1/1/7
    no shutdown
    no routing
    description client3
    vlan access 20
interface 1/1/8
    no shutdown
    no routing
    description client4
    vlan access 20
interface 1/1/9
    no shutdown
    no routing
    description client5
    vlan access 30
!
interface vlan 10
    ip address 172.30.10.1/24
    ip helper-address 172.30.1.7
interface vlan 20
    ip address 172.30.20.1/24
    ip helper-address 172.30.1.7
interface vlan 30
    ip address 172.30.30.1/24
    ip helper-address 172.30.1.7
!
ip route 0.0.0.0/0 172.30.255.0
!
logging 172.30.1.3 udp 5514
