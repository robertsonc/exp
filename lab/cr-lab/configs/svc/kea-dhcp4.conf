// Kea DHCPv4 for the three attendee VLANs. Requests arrive relayed by the AOS-CX SVIs (ip helper-address 172.30.1.7);
// Kea picks the subnet from the relay's giaddr. Lease lines (DHCP4_LEASE_ALLOC) go to syslog -> rsyslog -> the runner,
// which is the runner's DHCP identity fallback in a lab without Mist or EdgeConnect.
{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth1" ], "dhcp-socket-type": "udp" },
    "lease-database": { "type": "memfile", "persist": true, "name": "/var/lib/kea/kea-leases4.csv", "lfc-interval": 3600 },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "option-data": [
      { "name": "domain-name-servers", "data": "172.30.1.7" },
      { "name": "domain-name", "data": "cr-lab.test" }
    ],
    "subnet4": [
      { "id": 10, "subnet": "172.30.10.0/24", "pools": [ { "pool": "172.30.10.100 - 172.30.10.199" } ],
        "option-data": [ { "name": "routers", "data": "172.30.10.1" } ] },
      { "id": 20, "subnet": "172.30.20.0/24", "pools": [ { "pool": "172.30.20.100 - 172.30.20.199" } ],
        "option-data": [ { "name": "routers", "data": "172.30.20.1" } ] },
      { "id": 30, "subnet": "172.30.30.0/24", "pools": [ { "pool": "172.30.30.100 - 172.30.30.199" } ],
        "option-data": [ { "name": "routers", "data": "172.30.30.1" } ] }
    ],
    "loggers": [
      { "name": "kea-dhcp4", "output_options": [ { "output": "syslog:kea-dhcp4" } ], "severity": "INFO" }
    ]
  }
}
