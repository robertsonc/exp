# DNS only (DHCP is Kea). Attendee resolver for the lab; query lines go to syslog -> runner (DNS evidence).
port=53
listen-address=172.30.1.7
bind-interfaces
no-dhcp-interface=eth1
no-resolv
no-hosts
server=1.1.1.1
server=9.9.9.9
cache-size=1000
log-queries
log-facility=-
# The speed-check page name, and the DNS-leg zone delegated to the box (it is authoritative for t.speed.cr-lab.test).
address=/speed.cr-lab.test/172.30.1.3
server=/t.speed.cr-lab.test/172.30.1.3
