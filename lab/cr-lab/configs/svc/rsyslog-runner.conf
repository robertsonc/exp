# Forward Kea lease lines and dnsmasq query lines to the runner's syslog receiver (UDP 5514 on the core box).
# The runner only accepts senders in correlation.sources.syslog.allow: add 172.30.1.7/32 there.
if ($programname startswith "kea-dhcp4" or $programname == "dnsmasq") then {
  action(type="omfwd" target="172.30.1.3" port="5514" protocol="udp" template="RSYSLOG_SyslogProtocol23Format")
}
