frr defaults traditional
hostname core
service integrated-vtysh-config
!
interface eth1
 description to access 1/1/1
 ip address 172.30.255.0/31
interface eth2
 description to edge
 ip address 172.30.255.2/31
interface eth3
 description to collector
 ip address 172.30.1.0/31
interface eth4
 description to box (speedtest + runner)
 ip address 172.30.1.2/31
interface eth5
 description to dashboard
 ip address 172.30.1.4/31
interface eth6
 description to svc (DHCP/DNS)
 ip address 172.30.1.6/31
!
ip route 172.30.10.0/24 172.30.255.1
ip route 172.30.20.0/24 172.30.255.1
ip route 172.30.30.0/24 172.30.255.1
ip route 0.0.0.0/0 172.30.255.3
!
