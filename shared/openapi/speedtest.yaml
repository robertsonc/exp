      security: []
      x-exp-wp: WP-10
      description: 'Requested as `http://<nonce>.<dns_zone>/st/px` (the Host names a nonce under the delegated
        DNS-leg zone; the box also runs the zone''s authoritative DNS server). The page reads Resource
        Timing `domainLookupEnd - domainLookupStart` (cross-origin, so `Timing-Allow-Origin: *` is mandatory).
