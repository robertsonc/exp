      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeedtestAggregate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /speedtests/stream:
    get:
      operationId: streamSpeedtests
      summary: 'Server-sent events: new tests, evidence, diagnoses'
      tags:
      - speedtests
      - stream
      x-exp-wp: WP-11
      parameters:
      - name: site
        in: query
        required: false
        description: Site.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/slug
      - name: Last-Event-ID
        in: header
        required: false
        description: Resume point (replay at most `stream_replay_s`, default 300 s).
        schema:
          type: string
          maxLength: 128
      - $ref: '#/components/parameters/XExpUser'
      x-exp-sse-events:
        speedtest:
          data:
            $ref: '#/components/schemas/SpeedtestRow'
          description: A test was stored.
        evidence:
          data:
            type: object
            properties:
              id:
                $ref: ../schemas/common.schema.json#/$defs/st_id
              kind:
                enum:
                - wifi
                - wired
                - flows
                - wan
                - security
                - baseline
                - dns
                - identity
            required:
            - id
            - kind
            additionalProperties: false
          description: Evidence of a kind arrived.
        diagnosis:
          data:
            type: object
            properties:
              id:
                $ref: ../schemas/common.schema.json#/$defs/st_id
              stage:
                enum:
                - quick
                - final
              cause:
                type: string
                maxLength: 64
            required:
            - id
            - stage
            - cause
            additionalProperties: false
          description: A diagnosis was produced or updated.
      x-exp-sse-comments:
        keepalive_interval_s: 15
        retry_ms: 3000
        replay_window_s: 300
      responses:
        '200':
          description: '`text/event-stream`. Events: `speedtest`, `evidence`, `diagnosis`. A `: keepalive`
            comment every 15 s; `retry: 3000`.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /speedtests/feed:
    get:
      operationId: speedtestFeed
