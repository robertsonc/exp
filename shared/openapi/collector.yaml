      - speedtests
      x-exp-wp: WP-11
      parameters:
      - name: group_by
        in: query
        required: true
        description: Grouping.
        schema:
          enum:
          - zone
          - ap
          - ssid
          - band
          - os_family
          - hour
          - cause
      - name: metric
        in: query
        required: true
        description: Metric.
        schema:
          enum:
          - down_p50
          - up_p50
          - loaded_p50
          - score_p50
          - count
      - name: leg
        in: query
        required: false
        description: Leg (default local).
        schema:
          enum:
          - local
          - internet
      - name: site
        in: query
        required: false
        description: Site.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/slug
      - name: from
        in: query
        required: false
        description: Start.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/ts
      - name: to
        in: query
        required: false
        description: End.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/ts
