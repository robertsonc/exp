      - collector_probes
      - dashboard_collectors
      - iface_errors
    Issue:
      type: object
      properties:
        issue_id: &id001
          type: string
          pattern: ^iss_[0-9A-HJKMNP-TV-Z]{26}$
          description: 'Issue id: `iss_` + ULID.'
        kind:
          $ref: '#/components/schemas/IssueKind'
        severity:
          $ref: '#/components/schemas/Severity'
        host_id:
          $ref: ../schemas/common.schema.json#/$defs/h_id
        component_id:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/cmp_id
        component_type:
          anyOf:
          - type: 'null'
          - enum:
            - probe
            - collector
            - dashboard
            - runner
            - speedtest
          description: Type of the component the issue is about (null for host-level issues and for issues
            that predate the field and whose component is gone). Stored with the issue, so it survives deletion
            of the component (CR-wp5-fleet-api-gaps item 6).
        site:
          $ref: ../schemas/common.schema.json#/$defs/slug
        opened_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
        resolved_at:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ts
        last_value:
          anyOf:
          - type: 'null'
          - type: number
        detail:
          type: string
          maxLength: 512
        snoozed_until:
          anyOf:
          - type: 'null'
          - anyOf:
            - $ref: ../schemas/common.schema.json#/$defs/ts
            - enum:
              - resolved
      required:
      - issue_id
      - kind
      - severity
      - host_id
      - site
      - opened_at
      - resolved_at
      - detail
      additionalProperties: true
    SnoozeRequest:
      type: object
      properties:
        for:
          enum:
          - 1h
          - 24h
          - resolved
      required:
      - for
      additionalProperties: false
    Snooze:
      type: object
      properties:
        issue_id: *id001
        kind:
          $ref: '#/components/schemas/IssueKind'
        host_id:
          $ref: ../schemas/common.schema.json#/$defs/h_id
        until:
          anyOf:
          - $ref: ../schemas/common.schema.json#/$defs/ts
          - enum:
            - resolved
        created_by:
          type: string
          maxLength: 254
      required:
      - issue_id
      - kind
      - host_id
      - until
      additionalProperties: true
    FleetThresholds:
      type: object
      properties:
        disk_high:
          type: object
          properties:
            warn_pct:
              type: number
              minimum: 0
              maximum: 100
              default: 85
            crit_pct:
              type: number
              minimum: 0
              maximum: 100
              default: 95
          additionalProperties: true
        storage_runway:
          type: object
          properties:
            warn_days:
              type: number
              minimum: 0
              default: 7
            crit_days:
              type: number
              minimum: 0
              default: 2
          additionalProperties: true
        mem_low:
          type: object
          properties:
            available_pct:
              type: number
              minimum: 0
              maximum: 100
              default: 10
            for_min:
              type: integer
              minimum: 1
              maximum: 1440
              default: 10
          additionalProperties: true
        cpu_high:
          type: object
          properties:
            pct:
              type: number
              minimum: 0
              maximum: 100
              default: 90
            avg_min:
              type: integer
              minimum: 1
              maximum: 1440
              default: 15
          additionalProperties: true
        probe_push_lag:
          type: object
          properties:
            warn_s:
              type: number
              minimum: 0
              default: 120
            crit_s:
              type: number
              minimum: 0
              default: 600
          additionalProperties: true
        probe_spool:
          type: object
          properties:
            pct:
              type: number
              minimum: 0
              maximum: 100
              default: 50
          additionalProperties: true
        crash_loop:
          type: object
          properties:
            restarts:
              type: integer
              minimum: 1
              default: 3
            window_min:
              type: integer
              minimum: 1
              default: 15
          additionalProperties: true
        version_drift:
          type: object
          properties:
            minutes:
              type: integer
              minimum: 1
              default: 10
          additionalProperties: true
        clock:
          type: object
          properties:
            offset_ms:
              type: number
              minimum: 0
              default: 1000
          additionalProperties: true
        iface_errors:
          type: object
          properties:
            pct:
              type: number
              minimum: 0
              default: 0.1
            window_min:
              type: integer
              minimum: 1
              default: 15
          additionalProperties: true
      additionalProperties: false
      description: Defaults from 05-manager.md section 14; any key may be omitted to keep its default.
    PlatformWebhook:
      type: object
      properties:
        format:
          enum:
          - slack
          - teams
          - json
        url:
          $ref: '#/components/schemas/SecretState'
      required:
      - format
      - url
      additionalProperties: true
      description: Fires on `crit` open and on resolve. The URL is a secret and is never returned.
    PlatformWebhookPut:
      type: object
      properties:
        format:
          enum:
          - slack
          - teams
          - json
        url:
          $ref: ../schemas/common.schema.json#/$defs/https_url
      required:
      - format
      additionalProperties: false
      description: '`url` is write-only; omit to keep the stored value.'
    WebhookTestResult:
      type: object
      properties:
        ok:
          type: boolean
        http_status:
          anyOf:
          - type: 'null'
          - type: integer
            minimum: 100
            maximum: 599
        error:
          anyOf:
          - type: 'null'
          - type: string
            maxLength: 256
      required:
      - ok
      additionalProperties: true
    AuditEvent:
      type: object
      properties:
        evt_id:
          $ref: ../schemas/common.schema.json#/$defs/evt_id
        ts:
          $ref: ../schemas/common.schema.json#/$defs/ts
        actor:
          type: string
          maxLength: 254
          description: Admin email, `agent:h_...`, or `system`.
        action:
          type: string
          maxLength: 64
        resource:
          type: string
          maxLength: 256
        details:
          type: object
          additionalProperties: true
          description: Never contains secret values.
        ip:
          anyOf:
          - type: 'null'
          - type: string
            maxLength: 64
      required:
      - evt_id
      - ts
      - actor
      - action
      - resource
      additionalProperties: true
    AdminEntry:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
        disabled:
          type: boolean
        last_seen:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - email
      - role
      additionalProperties: true
    Settings:
      type: object
      properties:
        org_name:
          type: string
          maxLength: 128
        drills_enabled:
          type: boolean
        drills_two_person:
          type: boolean
        default_retention:
          $ref: '#/components/schemas/Retention'
        release_channel:
          type: string
          maxLength: 32
        owner:
          type: string
          maxLength: 254
          description: Owner email.
        admins:
          type: array
          items:
            $ref: '#/components/schemas/AdminEntry'
          maxItems: 200
        updated_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - org_name
      - drills_enabled
      - drills_two_person
      - default_retention
      - owner
      - admins
      additionalProperties: true
    SettingsPatch:
      type: object
      properties:
        org_name:
          type: string
          maxLength: 128
          minLength: 1
        drills_enabled:
          type: boolean
        drills_two_person:
          type: boolean
        default_retention:
          $ref: '#/components/schemas/Retention'
        release_channel:
          type: string
          maxLength: 32
        owner:
          type: string
          maxLength: 254
        admins:
          type: array
          items:
            $ref: '#/components/schemas/AdminEntry'
          maxItems: 200
          description: Upserts (invite by email + role, or disable). Owner only.
      additionalProperties: false
      minProperties: 1
    SsoForm:
      type: string
      description: Self-contained HTML document with an auto-submitting form that POSTs `token` (the SSO
        handoff JWT) to `https://<dashboard>/auth/sso`. The token is never placed in a URL.
    Error:
      $ref: ../schemas/common.schema.json#/$defs/error_envelope
  responses:
    Unauthorized:
      description: Missing or invalid `Cf-Access-Jwt-Assertion` (signature, `aud`, `iss`, `exp`/`nbf`,
        or Access configuration absent). Fail closed.
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/error_envelope
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: unauthenticated
                  details: {}
    Forbidden:
      description: Authenticated but the email is not an admin (`unknown_admin`), is disabled, or the
        role is below `x-exp-min-role` (`insufficient_role`).
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/error_envelope
          examples:
            insufficient_role:
              value:
                error:
                  code: insufficient_role
                  message: insufficient role
                  details: {}
            unknown_admin:
              value:
                error:
                  code: unknown_admin
                  message: unknown admin
                  details: {}
    NotFound:
      description: 'Not found. Error codes: `not_found`.'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/error_envelope
          examples:
            not_found:
              value:
                error:
                  code: not_found
                  message: not found
                  details: {}
    BadRequest:
      description: Malformed JSON or failed validation (`details.errors` lists paths).
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/error_envelope
          examples:
            invalid_request:
              value:
                error:
                  code: invalid_request
                  message: invalid request
                  details: {}
    TooManyRequests:
      description: '`RL_ADMIN` limit (600/min per identity).'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/error_envelope
          examples:
            rate_limited:
              value:
                error:
                  code: rate_limited
                  message: rate limited
                  details: {}
      headers:
        Retry-After: &id002
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
            maximum: 3600
    ServiceUnavailable:
      description: 'Service unavailable. Error codes: `unavailable`.'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/error_envelope
          examples:
            unavailable:
              value:
                error:
                  code: unavailable
                  message: unavailable
                  details: {}
      headers:
        Retry-After: *id002
    Conflict:
      description: 'Conflict. Error codes: `conflict`.'
      content:
        application/json:
          schema:
            $ref: ../schemas/common.schema.json#/$defs/error_envelope
          examples:
            conflict:
              value:
                error:
                  code: conflict
                  message: conflict
                  details: {}
paths:
  /me:
    get:
      operationId: getMe
      summary: Current admin identity
      tags:
      - me
      x-exp-min-role: viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sites:
    get:
      operationId: listSites
      summary: List sites
      tags:
      - sites
      parameters: &id011
      - &id006
        $ref: '#/components/parameters/Limit'
      - &id007
        $ref: '#/components/parameters/Cursor'
      x-exp-min-role: viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  next_cursor:
                    anyOf:
                    - type: 'null'
                    - type: string
                      maxLength: 1024
                      description: Opaque cursor; null when there are no more pages.
                required:
                - items
                - next_cursor
                description: List envelope (01-contracts.md section 1).
        '400': &id003
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createSite
      summary: Create a site
      tags:
      - sites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400': *id003
        '409':
          description: Slug already in use.
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/error_envelope
              examples:
                site_exists:
                  value:
                    error:
                      code: site_exists
                      message: site exists
                      details: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sites/{site}:
    get:
      operationId: getSite
      summary: Get a site
      tags:
      - sites
      parameters:
      - &id004
        name: site
        in: path
        required: true
        description: Site slug.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/slug
      x-exp-min-role: viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404': &id005
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateSite
      summary: Update a site
      tags:
      - sites
      parameters:
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SitePatch'
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400': *id003
        '404': *id005
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteSite
      summary: Delete an empty site
      tags:
      - sites
      parameters:
      - *id004
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '204':
          description: Deleted.
        '404': *id005
        '409':
          description: Hosts still belong to the site.
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/error_envelope
              examples:
                site_not_empty:
                  value:
                    error:
                      code: site_not_empty
                      message: site not empty
                      details: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /hosts:
    get:
      operationId: listHosts
      summary: List hosts
      tags:
      - hosts
      parameters:
      - name: site
        in: query
        required: false
        description: Filter by site.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/slug
      - name: state
        in: query
        required: false
        description: Filter by state.
        schema:
          $ref: '#/components/schemas/HostState'
      - *id006
      - *id007
      x-exp-min-role: viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Host'
                  next_cursor:
                    anyOf:
                    - type: 'null'
                    - type: string
                      maxLength: 1024
                      description: Opaque cursor; null when there are no more pages.
                required:
                - items
                - next_cursor
                description: List envelope (01-contracts.md section 1).
        '400': *id003
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createHost
      summary: Create a host and its first enrol token
      tags:
      - hosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCreate'
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '201':
          description: Host created in state `pending`. The enrol command is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCreated'
          headers: &id009
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400': *id003
        '404': *id005
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /hosts/{id}:
    get:
      operationId: getHost
      summary: Get a host
      tags:
      - hosts
      parameters:
      - &id008
        name: id
        in: path
        required: true
        description: Host id (`h_...`).
        schema:
          $ref: ../schemas/common.schema.json#/$defs/h_id
      x-exp-min-role: viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '404': *id005
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateHost
      summary: Rename or move a host
      tags:
      - hosts
      parameters:
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostPatch'
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400': *id003
        '404': *id005
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteHost
      summary: Delete a pending or removed host
      tags:
      - hosts
      parameters:
      - *id008
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '204':
          description: Deleted.
        '404': *id005
        '409':
          description: Host is enrolled; decommission it first.
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/error_envelope
              examples:
                host_not_removable:
                  value:
                    error:
                      code: host_not_removable
                      message: host not removable
                      details: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /hosts/{id}/enrol-token:
    post:
      operationId: createEnrolToken
      summary: Issue a new enrol token (1 h)
      tags:
      - hosts
      parameters:
      - *id008
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '201':
          description: New token; earlier unused tokens are invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolToken'
          headers: *id009
        '404': *id005
        '409':
          description: Token reissue is for pending hosts; use rotate-agent for enrolled ones.
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/error_envelope
              examples:
                host_already_enrolled:
                  value:
                    error:
                      code: host_already_enrolled
                      message: host already enrolled
                      details: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /hosts/{id}/decommission:
    post:
      operationId: decommissionHost
      summary: Start decommissioning a host
      tags:
      - hosts
      parameters:
      - *id008
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '202':
          description: 'Desired state now carries `decommission: true`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '404': *id005
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /hosts/{id}/components:
    get:
      operationId: listHostComponents
      summary: List a host's components
      tags:
      - components
      parameters:
      - *id008
      - *id006
      - *id007
      x-exp-min-role: viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Component'
                  next_cursor:
                    anyOf:
                    - type: 'null'
                    - type: string
                      maxLength: 1024
                      description: Opaque cursor; null when there are no more pages.
                required:
                - items
                - next_cursor
                description: List envelope (01-contracts.md section 1).
        '404': *id005
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createComponent
      summary: Add a component to a host
      tags:
      - components
      parameters:
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentCreate'
      x-exp-min-role: admin
      x-exp-audited: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '400': *id003
        '404': *id005
        '409':
          description: Slug already used by a component of this type.
          content:
            application/json:
              schema:
                $ref: ../schemas/common.schema.json#/$defs/error_envelope
              examples:
                component_slug_exists:
                  value:
                    error:
                      code: component_slug_exists
                      message: component slug exists
                      details: {}
        '422':
          description: '`config` failed the component type''s schema or a guard.'
          content:
