    MetricSeries:
      type: object
      properties:
        range: &id018
          enum:
          - 1h
          - 6h
          - 24h
          - 7d
          - 30d
        step_s:
          enum:
          - 300
          - 3600
        as_of:
          $ref: ../schemas/common.schema.json#/$defs/ts
        series:
          type: object
          properties: {}
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/MetricPoint'
