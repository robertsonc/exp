            chartable keys of 05-manager.md section 13; probe components also accept `by_test_<name>` for
            each test of the catalog (01-contracts.md section 3), the per-test measurements per minute
            (CR-wp5-fleet-api-gaps item 5). `by_test_*` keys are only returned when asked for in `keys`.
