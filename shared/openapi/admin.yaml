          description: Map metric key -> points. Ranges 1h/6h/24h read 5-minute buckets; 7d/30d read 1-hour
            buckets. Every `t` is epoch SECONDS. Host keys are `cpu_pct mem_pct
            disk_pct load1 net_rx_pps net_tx_pps net_rx_bps net_tx_bps net_errors net_drops disk_write_kbps`
