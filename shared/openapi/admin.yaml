# exp OpenAPI contract (WP-0). Source of truth: docs/spec/01-contracts.md
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: exp admin API (manager UI to manager)
  version: 1.0.0
  description: '01-contracts.md section 13, 05-manager.md sections 3-5 and 8-14, 11-manager-ui.md. Base
    path `/api/admin/v1` on `https://<manager>`. Behind Cloudflare Access AND the Worker verifies `Cf-Access-Jwt-Assertion`
    on every request (RS256 against the team JWKS, `aud`, `iss`, `exp`/`nbf`); a missing or invalid JWT
    is `401` regardless of anything else. The JWT `email` maps to an admin row: an authenticated but unknown
    email is `403 unknown_admin`.


    Roles (`owner` > `admin` > `operator` > `viewer`): each operation documents its minimum role in `x-exp-min-role`;
    a lower role gets `403 insufficient_role`. Every mutation writes exactly one audit event (`x-exp-audited:
    true`) without secret values.


    Secrets: webhook URLs, integration credentials and similar are write-only; reads return `{"set":true,"updated_at":...}`.
    Dashboard local-user passwords are hashed in the browser (`pbkdf2_sha256$600000$<salt_b64>$<hash_b64>`);
    the API never sees plaintext passwords. Plaintext tokens (`expe_`, `expn_`) appear only in the response
    that creates them.


    Lists: `{items,next_cursor}`, `limit` <= 1000 default 100. Fleet endpoints return `ETag` and `Cache-Control:
    private, max-age=15`; the UI polls every 30 s with `If-None-Match`.'
  license:
    name: Proprietary
    identifier: LicenseRef-exp
servers:
- url: https://{manager}/api/admin/v1
  description: Manager Worker (Access protected)
  variables:
    manager:
      default: exp-control.harnessed.cloud
tags:
- name: me
- name: sites
- name: hosts
- name: components
- name: releases
- name: secrets
- name: dashboards
- name: alerts
- name: integrations
- name: drills
- name: status
- name: fleet
- name: issues
- name: platform
- name: audit
- name: settings
security:
- accessJwt: []
components:
  securitySchemes:
    ingestToken:
      type: http
      scheme: bearer
      bearerFormat: expi_<43 base64url chars>
      description: Per-probe ingest token, prefix `expi_`.
    dashboardToken:
      type: http
      scheme: bearer
      bearerFormat: expd_<43 base64url chars>
      description: Per-dashboard dashboard-to-collector token, prefix `expd_`.
    agentSecret:
      type: http
      scheme: bearer
      bearerFormat: expa_<43 base64url chars>
      description: Per-agent secret, prefix `expa_`.
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access JWT. The Worker verifies RS256 signature (team JWKS), `aud`, `iss`,
        `exp`/`nbf` on every admin request; missing or invalid -> 401. `Cf-Access-Authenticated-User-Email`
        is never trusted alone.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. 1..1000, default 100.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous `next_cursor`.
      schema:
        type: string
        maxLength: 1024
  headers:
    ETag: &id015
      description: Entity tag of the roll-up snapshot.
      schema:
        type: string
        maxLength: 128
    Cache-Control: &id016
      description: Always `private, max-age=15`.
      schema:
        type: string
        const: private, max-age=15
  schemas:
    Role:
      enum:
      - owner
      - admin
      - operator
      - viewer
      description: Admin role.
    ComponentType:
      enum:
      - probe
      - collector
      - dashboard
      - runner
      - speedtest
    Shape:
      enum:
      - probe
      - collector
      - dashboard
      - runner
      description: 'Host shape badge: P, C, D, R.'
    HostState:
      enum:
      - pending
      - enrolled
      - stale
      - offline
      - decommissioning
      - removed
    Health:
      enum:
      - ok
      - degraded
      - fail
      - unknown
    Severity:
      enum:
      - warn
      - crit
    SecretState:
      type: object
      properties:
        set:
          type: boolean
        updated_at:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - set
      - updated_at
      additionalProperties: true
      description: Write-only secret marker. The value is never returned.
    Timestamps:
      type: object
      properties:
        created_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
        updated_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - created_at
      - updated_at
      additionalProperties: true
    Me:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
      required:
      - email
      - role
      additionalProperties: true
    AlertsConfig:
      type: object
      properties:
        enabled:
          type: boolean
        board_url:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/https_url
        timezone:
          $ref: ../schemas/common.schema.json#/$defs/timezone
        voice:
          $ref: ../schemas/common.schema.json#/$defs/voice
        hold_down_s:
          type: integer
          minimum: 0
          maximum: 3600
        hold_back_s:
          type: integer
          minimum: 0
          maximum: 3600
        reopen_s:
          type: integer
          minimum: 0
          maximum: 86400
        calm_s:
          type: integer
          minimum: 0
          maximum: 86400
      required:
      - enabled
      - voice
      - hold_down_s
      - hold_back_s
      - reopen_s
      - calm_s
      additionalProperties: true
      description: Site alert behaviour (no secrets).
    WebhookRead:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          pattern: ^wh_[A-Za-z0-9_-]{1,60}$
        format:
          enum:
          - slack
          - teams
          - json
        url:
          $ref: '#/components/schemas/SecretState'
      required:
      - id
      - format
      - url
      additionalProperties: true
      description: Webhook URL is a secret and is never returned.
    WebhookWrite:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          pattern: ^wh_[A-Za-z0-9_-]{1,60}$
          description: Omit on create (server assigns).
        format:
          enum:
          - slack
          - teams
          - json
        url:
          allOf:
          - $ref: ../schemas/common.schema.json#/$defs/https_url
          description: Write-only. Omit to keep the stored value.
      required:
      - format
      additionalProperties: false
    Alerts:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/AlertsConfig'
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookRead'
          maxItems: 20
      required:
      - config
      - webhooks
      additionalProperties: true
    AlertsPut:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/AlertsConfig'
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookWrite'
          maxItems: 20
      required:
      - config
      - webhooks
      additionalProperties: false
    AlertTestResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              webhook_id:
                type: string
                maxLength: 64
              ok:
                type: boolean
              http_status:
                anyOf:
                - type: 'null'
                - type: integer
                  minimum: 100
                  maximum: 599
              error:
                anyOf:
                - type: 'null'
                - type: string
                  maxLength: 256
            required:
            - webhook_id
            - ok
            additionalProperties: true
          maxItems: 20
      required:
      - results
      additionalProperties: true
    Retention:
      type: object
      properties:
        metrics_days:
          type: integer
          minimum: 1
          maximum: 365
        records_days:
          type: integer
          minimum: 1
          maximum: 365
      required:
      - metrics_days
      - records_days
      additionalProperties: true
    Site:
      type: object
      properties:
        site:
          $ref: ../schemas/common.schema.json#/$defs/slug
        name:
          type: string
          maxLength: 128
          minLength: 1
        timezone:
          $ref: ../schemas/common.schema.json#/$defs/timezone
        edge_label:
          type: string
          maxLength: 32
        release_version:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/semver
        canary_host_id:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/h_id
        canary_state:
          anyOf:
          - type: 'null'
          - enum:
            - pending
            - healthy_waiting
            - promoted
            - failed
        retention:
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/Retention'
        created_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
        updated_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - site
      - name
      - timezone
      - edge_label
      - release_version
      - canary_host_id
      - created_at
      - updated_at
      additionalProperties: true
    SiteCreate:
      type: object
      properties:
        site:
          $ref: ../schemas/common.schema.json#/$defs/slug
        name:
          type: string
          maxLength: 128
          minLength: 1
        timezone:
          $ref: ../schemas/common.schema.json#/$defs/timezone
        edge_label:
          type: string
          maxLength: 32
        retention:
          $ref: '#/components/schemas/Retention'
      required:
      - site
      - name
      - timezone
      additionalProperties: false
    SitePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
        timezone:
          $ref: ../schemas/common.schema.json#/$defs/timezone
        edge_label:
          type: string
          maxLength: 32
        retention:
          $ref: '#/components/schemas/Retention'
      additionalProperties: false
      minProperties: 1
    SiteRelease:
      type: object
      properties:
        version:
          $ref: ../schemas/common.schema.json#/$defs/semver
        canary_host_id:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/h_id
      required:
      - version
      additionalProperties: false
      description: Set the target release for a site. The canary host (if any) compiles first and is promoted
        after 10 healthy minutes. Rollback = set a previous version.
    HostFacts:
      $ref: ../schemas/status.schema.json#/properties/facts
    Host:
      type: object
      properties:
        host_id:
          $ref: ../schemas/common.schema.json#/$defs/h_id
        name:
          type: string
          maxLength: 128
          minLength: 1
        site:
          $ref: ../schemas/common.schema.json#/$defs/slug
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/Shape'
          maxItems: 4
          uniqueItems: true
        state:
          $ref: '#/components/schemas/HostState'
        mgmt_ip:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ipv4
        facts:
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/HostFacts'
        last_seen:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ts
        agent_version:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/semver
        desired_version:
          anyOf:
          - type: 'null'
          - type: integer
            minimum: 0
        applied_version:
          anyOf:
          - type: 'null'
          - type: integer
            minimum: 0
        created_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
        updated_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - host_id
      - name
      - site
      - shapes
      - state
      - last_seen
      - agent_version
      - desired_version
      - applied_version
      - created_at
      - updated_at
      additionalProperties: true
    HostCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
        site:
          $ref: ../schemas/common.schema.json#/$defs/slug
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/Shape'
          maxItems: 4
          uniqueItems: true
      required:
      - name
      - site
      additionalProperties: false
    HostPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
        site:
          $ref: ../schemas/common.schema.json#/$defs/slug
      additionalProperties: false
      minProperties: 1
    EnrolToken:
      type: object
      properties:
        token:
          allOf:
          - $ref: ../schemas/common.schema.json#/$defs/expe_token
          description: Shown once; only sha256 is stored.
        command:
          type: string
          maxLength: 2048
          description: The one-liner for the target host, e.g. `curl -fsSL https://<manager>/install.sh
            | sudo bash -s -- expe_...` (the token is the positional argument of install.sh and is never
            placed in a process's argv by the agent itself).
        expires_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - token
      - command
      - expires_at
      additionalProperties: true
    HostCreated:
      type: object
      properties:
        host:
          $ref: '#/components/schemas/Host'
        enrol:
          $ref: '#/components/schemas/EnrolToken'
      required:
      - host
      - enrol
      additionalProperties: true
    Component:
      type: object
      properties:
        component_id:
          $ref: ../schemas/common.schema.json#/$defs/cmp_id
        host_id:
          $ref: ../schemas/common.schema.json#/$defs/h_id
        type:
          $ref: '#/components/schemas/ComponentType'
        id:
          $ref: ../schemas/common.schema.json#/$defs/slug
        config:
          type: object
          additionalProperties: true
          description: Admin intent (no secrets). The manager compiles it with wiring into the rendered
            config.
        rendered_config:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/probe.config.schema.json
          - $ref: ../schemas/collector.config.schema.json
          - $ref: ../schemas/dashboard.config.schema.json
          - $ref: ../schemas/runner.config.schema.json
          description: Read-only config as last compiled for the host (never contains creds).
        enabled:
          type: boolean
        health:
          $ref: '#/components/schemas/Health'
        version:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/semver
        facts:
          type: object
          additionalProperties: true
          description: 'From status reports: TLS fingerprint, listen address, health facts.'
        created_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
        updated_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - component_id
      - host_id
      - type
      - id
      - config
      - enabled
      - health
      - created_at
      - updated_at
      additionalProperties: true
    ComponentCreate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ComponentType'
        id:
          $ref: ../schemas/common.schema.json#/$defs/slug
        config:
          type: object
          additionalProperties: true
      required:
      - type
      - id
      - config
      additionalProperties: false
    ComponentPatch:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
      additionalProperties: false
      minProperties: 1
    PortsPut:
      type: object
      properties:
        ports:
          type: array
          items:
            $ref: ../schemas/probe.config.schema.json#/$defs/port
          maxItems: 64
          minItems: 1
      required:
      - ports
      additionalProperties: false
      description: 'Replaces the probe''s port assignments. The host''s management interface (default-route
        / `in_use_by: mgmt`) is refused with `mgmt_interface_refused`; every `iface` must exist in the
        host facts.'
    Ports:
      type: object
      properties:
        component_id:
          $ref: ../schemas/common.schema.json#/$defs/cmp_id
        ports:
          type: array
          items:
            $ref: ../schemas/probe.config.schema.json#/$defs/port
          maxItems: 64
        desired_version:
          anyOf:
          - type: 'null'
          - type: integer
            minimum: 0
      required:
      - component_id
      - ports
      additionalProperties: true
    Artifact:
      type: object
      properties:
        artifact_id:
          $ref: ../schemas/common.schema.json#/$defs/art_id
        name:
          $ref: ../schemas/common.schema.json#/$defs/artifact_name
        component:
          enum:
          - agent
          - probe
          - collector
          - dashboard
          - runner
        arch:
          enum:
          - amd64
          - arm64
          - noarch
        sha256:
          $ref: ../schemas/common.schema.json#/$defs/sha256_hex
        size:
          type: integer
          minimum: 0
      required:
      - artifact_id
      - name
      - component
      - arch
      - sha256
      - size
      additionalProperties: true
    Release:
      type: object
      properties:
        rel_id:
          $ref: ../schemas/common.schema.json#/$defs/rel_id
        version:
          $ref: ../schemas/common.schema.json#/$defs/semver
        source:
          enum:
          - github
          - upload
        verified_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
        notes_url:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/https_url
        min_agent_version:
          $ref: ../schemas/common.schema.json#/$defs/semver
        created:
          $ref: ../schemas/common.schema.json#/$defs/ts
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
          maxItems: 64
        sites:
          type: array
          items:
            $ref: ../schemas/common.schema.json#/$defs/slug
          maxItems: 1000
          description: Sites currently targeting this release.
      required:
      - rel_id
      - version
      - source
      - verified_at
      - min_agent_version
      - artifacts
      additionalProperties: true
    ReleaseImport:
      type: object
      properties:
        version:
          $ref: ../schemas/common.schema.json#/$defs/semver
        source:
          enum:
          - github
          - upload
      required:
      - version
      - source
      additionalProperties: false
      description: Import from GitHub Releases of `RELEASES_REPO`. The Ed25519 signature is verified over
        the exact manifest bytes and every artifact sha256 is checked; any mismatch records nothing (`signature_invalid`,
        `artifact_hash_mismatch`).
    ReleaseUpload:
      type: object
      properties:
        manifest:
          type: string
          description: Binary manifest JSON file.
        signature:
          type: string
          description: Binary or base64 detached Ed25519 signature file.
        artifacts:
          type: array
          items:
            type: string
            description: Binary artifact tarball.
          maxItems: 64
          minItems: 1
      required:
      - manifest
      - signature
      - artifacts
      additionalProperties: false
    RotateResult:
      type: object
      properties:
        component_id:
          $ref: ../schemas/common.schema.json#/$defs/cmp_id
        kinds:
          type: array
          items:
            type: string
            maxLength: 32
          maxItems: 8
        previous_valid_until:
          $ref: ../schemas/common.schema.json#/$defs/ts
        desired_version:
          type: integer
          minimum: 0
      required:
      - component_id
      - kinds
      - previous_valid_until
      - desired_version
      additionalProperties: true
      description: New plaintext tokens are delivered to consumers through desired state only, never in
        this response. The previous value stays valid for 10 minutes.
    Accepted:
      type: object
      properties:
        host_id:
          $ref: ../schemas/common.schema.json#/$defs/h_id
        action_id:
          $ref: ../schemas/common.schema.json#/$defs/act_id
        desired_version:
          type: integer
          minimum: 0
      required:
      - host_id
      - desired_version
      additionalProperties: true
    DashboardUser:
      type: object
      properties:
        usr_id:
          $ref: ../schemas/common.schema.json#/$defs/usr_id
        username:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]{1,64}$
        role:
          enum:
          - viewer
          - operator
          - admin
        created_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - usr_id
      - username
      - role
      - created_at
      additionalProperties: true
      description: The password hash is never returned.
    DashboardUserCreate:
      type: object
      properties:
        username:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]{1,64}$
        role:
          enum:
          - viewer
          - operator
          - admin
        hash:
          type: string
          maxLength: 512
          pattern: ^pbkdf2_sha256\$600000\$[A-Za-z0-9+/=_-]+\$[A-Za-z0-9+/=_-]+$
          description: Computed in the browser (WebCrypto). Plaintext passwords never reach the manager.
      required:
      - username
      - role
      - hash
      additionalProperties: false
    NocToken:
      type: object
      properties:
        noc_id:
          $ref: ../schemas/common.schema.json#/$defs/noc_id
        label:
          type: string
          maxLength: 128
        role:
          enum:
          - viewer
        expires_at:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ts
        revoked_at:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ts
        created_at:
          $ref: ../schemas/common.schema.json#/$defs/ts
      required:
      - noc_id
      - label
      - role
      - expires_at
      - revoked_at
      - created_at
      additionalProperties: true
    DashboardTls:
      type: object
      properties:
        mode:
          enum:
          - self_signed
          - provided
        set:
          type: boolean
        updated_at:
          anyOf:
          - type: 'null'
          - $ref: ../schemas/common.schema.json#/$defs/ts
        cert:
          anyOf:
          - type: 'null'
          - type: object
            properties:
              subject:
                type: string
                maxLength: 1024
              issuer:
                type: string
                maxLength: 1024
              not_before:
                $ref: ../schemas/common.schema.json#/$defs/ts
              not_after:
                $ref: ../schemas/common.schema.json#/$defs/ts
              sha256:
                type: string
                description: Upper-case colon-separated SHA-256 of the leaf certificate DER (the dashboard's `tls_fingerprint_sha256`).
                pattern: ^([0-9A-F]{2}:){31}[0-9A-F]{2}$
              san:
                type: array
                maxItems: 64
                items:
                  type: string
                  maxLength: 256
            required:
            - subject
            - issuer
            - not_before
            - not_after
            - sha256
            - san
            additionalProperties: false
      required:
      - mode
      - set
      - updated_at
      - cert
      additionalProperties: false
      description: 'Dashboard TLS state (05-manager.md section 8). Write-only: the key (and the PEM) is never returned; `cert` is
        parsed from the stored leaf certificate.'
    DashboardTlsPut:
      oneOf:
      - type: object
        properties:
          mode:
            const: self_signed
        required:
        - mode
        additionalProperties: false
        description: Delete any provided pair; the agent generates a self-signed certificate.
      - type: object
        properties:
          mode:
            const: provided
          cert_pem:
            type: string
            minLength: 1
            maxLength: 32768
