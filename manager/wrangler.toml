# exp-manager Worker. deploy.sh replaces the placeholders (database_id, vars) idempotently.
name = "exp-manager"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"
# nodejs_compat is not required: only WebCrypto, fetch, D1, R2 are used.

[build]
# Bundles agent/install/install.sh (or a placeholder while the agent bootstrap is not built yet).
command = "node scripts/prepare.mjs"

# Text-module rule: shell scripts imported by the Worker are bundled as strings.
[[rules]]
type = "Text"
globs = ["**/*.sh"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "exp-manager"
database_id = "00000000-0000-0000-0000-000000000000" # replaced by deploy.sh
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "exp-artifacts"

[[ratelimits]]
name = "RL_ENROL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AGENT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[triggers]
crons = ["*/5 * * * *", "0 * * * *", "0 3 * * *"]

[assets]
directory = "./ui/dist"
binding = "ASSETS"
# The Worker handles these first; everything else is served from the static assets (admin SPA).
run_worker_first = ["/api/*", "/install.sh", "/healthz", "/kiosk", "/kiosk/*"]
not_found_handling = "single-page-application"

[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
EXP_OWNER_EMAIL = ""
RELEASE_PUBKEY_PEM = ""
RELEASES_REPO = ""
ORG_NAME = ""
MANAGER_URL = ""          # optional; default: learned from the first authenticated admin request
KIOSK_ALLOW_CIDRS = ""    # optional; source CIDRs for the read-only /kiosk (deploy.sh --kiosk-allow-ip); empty = no kiosk

# Secrets (wrangler secret put): EXP_MASTER_KEY (base64, 32 bytes), GITHUB_TOKEN (optional).
