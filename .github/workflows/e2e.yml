# End-to-end acceptance suites: nightly, on demand, and on pull requests labelled "e2e".
# test/e2e and test/harness are owned by WP-8; this workflow only runs them and is a no-op while absent.
name: e2e
on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: packaging/ci-venv.sh 3.10
      - name: Acceptance suites (privileged Docker harness)
        run: |
          set -euo pipefail
          if [ -d test/e2e ]; then
            .venv/bin/python -m pytest test/e2e -q -ra -m "not internet"
          else
            echo "test/e2e not present yet (WP-8); nothing to run"
          fi
