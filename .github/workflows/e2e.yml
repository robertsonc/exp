# End-to-end acceptance suites: nightly, on demand, and on pull requests labelled "e2e".
#   m1  test/e2e/m1  A1.1-A1.5  one-site data plane (container LAN harness)
#   m2  test/e2e/m2  A2.2-A2.8  control plane: manager under `wrangler dev` + agent-managed Ubuntu systemd containers
#   m3  test/e2e/m3  A3.1-A3.4  multi-site, alerts, offline; A3.3 keeps the manager unreachable for 30 minutes
# The three run on separate runners (their Docker networks, names and ports do not overlap, but they are heavy).
# Nightly, on-demand and labelled pull-request runs all use the spec's full 30-minute A3.3 outage
# (EXP_M3_MANAGER_OUTAGE_S=1800); the m3 job timeout is sized for it.
name: e2e
on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.63.0"
  # A3.3 (manager unreachable): the spec's 30 minutes on every trigger
  EXP_M3_MANAGER_OUTAGE_S: '1800'

jobs:
  m1:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: packaging/ci-venv.sh 3.10
      - name: Fetch vendored dependencies (sha256-verified against packaging/vendor.lock; the suites build a real release)
        run: packaging/fetch-vendor.sh
      - name: Playwright + Chromium (pinned; test/e2e/m1/board.js resolves it from test/e2e/m1/node_modules)
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix test/e2e/m1 "playwright@${PLAYWRIGHT_VERSION}"
          (cd test/e2e/m1 && npx --no-install playwright install --with-deps chromium)
      - name: M1 acceptance (privileged Docker harness)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          EXP_E2E_ARTIFACTS="$RUNNER_TEMP/e2e-artifacts" .venv/bin/python -m pytest test/e2e/m1 -q -ra -m "not internet"
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m1-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  m2:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: packaging/ci-venv.sh 3.10
      - name: Fetch vendored dependencies (sha256-verified against packaging/vendor.lock; the suites build a real release)
        run: packaging/fetch-vendor.sh
      - name: Manager (wrangler dev) and its admin UI bundle (the Worker serves ui/dist)
        run: |
          set -euo pipefail
          (cd manager && npm ci --ignore-scripts)
          (cd manager/ui && npm ci --ignore-scripts && npm run build)
      - name: /etc/hosts must be writable (the Worker reaches the local Access issuer, the hosts reach the manager, by name)
        run: sudo chmod a+w /etc/hosts
      - name: M2 acceptance (manager under wrangler dev + agent-managed systemd containers)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          EXP_E2E_ARTIFACTS="$RUNNER_TEMP/e2e-artifacts" .venv/bin/python -m pytest test/e2e/m2 -q -ra -m "not internet"
      - name: Keep logs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m2-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  m3:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    # A3.1/A3.2/A3.4 on the multisite harness (~45 min) + A3.3: provisioning (~10 min), the outage (30 min, 3 min on a
    # labelled pull request), the recovery checks (~10 min) - with slack for slow runners.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: packaging/ci-venv.sh 3.10
      - name: Fetch vendored dependencies (sha256-verified against packaging/vendor.lock; the suites build a real release)
        run: packaging/fetch-vendor.sh
      - name: Playwright + Chromium (pinned; the board checks resolve it from test/e2e/m1/node_modules)
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix test/e2e/m1 "playwright@${PLAYWRIGHT_VERSION}"
          (cd test/e2e/m1 && npx --no-install playwright install --with-deps chromium)
      - name: Manager (wrangler dev) and its admin UI bundle (A3.3 runs the manager)
        run: |
          set -euo pipefail
          (cd manager && npm ci --ignore-scripts)
          (cd manager/ui && npm ci --ignore-scripts && npm run build)
      - name: /etc/hosts must be writable (A3.3 - the Worker reaches the local Access issuer, the host reaches the manager, by name)
        run: sudo chmod a+w /etc/hosts
      - name: M3 acceptance (A3.1 federation, A3.2 alerts, A3.3 manager unreachable, A3.4 internet down)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          echo "A3.3 outage length: ${EXP_M3_MANAGER_OUTAGE_S} s"
          EXP_E2E_ARTIFACTS="$RUNNER_TEMP/e2e-artifacts" .venv/bin/python -m pytest test/e2e/m3 -q -ra -m "not internet"
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-m3-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
